[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finance101"
version = "0.1.0"
description = "Fundamentals of finance implemented in plain Python"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["finance101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
